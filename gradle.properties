# Specifies the JVM arguments used for the daemon process.
# Added headless mode to prevent AWT-EventQueue NullPointerException on CI/GitHub Actions
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Djava.awt.headless=true

# When configured, Gradle will run in incubating parallel mode.
org.gradle.parallel=true
kotlin.code.style=official

# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies
android.nonTransitiveRClass=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Set the maximum number of workers to avoid overloading CI machine
org.gradle.workers.max=2

# 🛑 FIX: Avoid in-process strategy on CI to prevent KSP IntelliJ AWT-EventQueue crash
kotlin.compiler.execution.strategy=out-of-process

# 🛑 FIX: KSP Stability Flags on Headless CI (Room & Moshi CodeGen)
ksp.useKSP2=false
ksp.incremental=false

# Allow the google-services plugin to work even if google-services.json is missing
googleServices.missing.passthrough=true
