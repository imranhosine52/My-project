name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select Build Type to Generate'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - release
          - debug

jobs:
  build:
    name: 🚀 Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🐘 Setup Gradle & Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: 🔑 Prepare Keystores & Environment Files
        run: |
          echo "Setting up environment configuration..."
          
          # Auto generate gradle wrapper jar if missing
          gradle wrapper --gradle-version 9.3.1 || true
          
          # Create .env from .env.example if missing
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
              echo "Created .env from .env.example"
            else
              touch .env
            fi
          fi

          # 🛡️ Release Keystore তৈরি বা চেক
          if [ ! -f my-upload-key.jks ]; then
            echo "Generating release upload keystore..."
            keytool -genkey -v -keystore my-upload-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass android -keypass android -dname "CN=DramaFlix, OU=Mobile, O=PlayDramaFlix, L=Dhaka, ST=Dhaka, C=BD"
          fi

          # 🛠️ Debug Keystore তৈরি বা চেক
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          chmod +x gradlew || true

      # 🔑 স্বয়ংক্রিয়ভাবে SHA-1 এবং SHA-256 বের করে লগ ও সামারিতে দেখানো
      - name: 🔥 Auto Extract SHA-1 & SHA-256 Fingerprints
        run: |
          echo "========================================================"
          echo "🔥 YOUR FIREBASE & ASSETLINKS SIGNING FINGERPRINTS 🔥"
          echo "========================================================"
          
          echo "## 🔑 Firebase & AssetLinks Fingerprints" >> $GITHUB_STEP_SUMMARY
          
          if [ -f my-upload-key.jks ]; then
            echo "--- RELEASE KEYSTORE (my-upload-key.jks) ---"
            RELEASE_FINGERPRINTS=$(keytool -list -v -keystore my-upload-key.jks -alias upload -storepass android -keypass android | grep -E "SHA1|SHA256" || true)
            echo "$RELEASE_FINGERPRINTS"
            
            echo "### 🛡️ Release Keystore (my-upload-key.jks)" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            echo "$RELEASE_FINGERPRINTS" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "--------------------------------------------------------"
          
          if [ -f debug.keystore ]; then
            echo "--- DEBUG KEYSTORE (debug.keystore) ---"
            DEBUG_FINGERPRINTS=$(keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1|SHA256" || true)
            echo "$DEBUG_FINGERPRINTS"
            
            echo "### 🛠️ Debug Keystore" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            echo "$DEBUG_FINGERPRINTS" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "========================================================"

      - name: 🛡️ Build Release APK (PlayDramaFlix-release.apk)
        if: ${{ github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'release' || github.event.inputs.build_type == '' || github.event_name == 'push' || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "🚀 Building Release APK..."
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            ./gradlew assembleRelease --stacktrace --no-daemon
          else
            gradle assembleRelease --stacktrace --no-daemon
          fi

      - name: 🛠️ Build Debug APK (Optional)
        if: ${{ github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'debug' }}
        run: |
          echo "🛠️ Building Debug APK..."
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: 📦 Organize APK Artifacts
        run: |
          mkdir -p output_apks
          
          # Release APK
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk output_apks/PlayDramaFlix-release.apk
            echo "✓ Successfully prepared PlayDramaFlix-release.apk"
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk output_apks/PlayDramaFlix-release.apk
            echo "✓ Successfully prepared PlayDramaFlix-release.apk (unsigned)"
          fi
          
          # Debug APK
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk output_apks/PlayDramaFlix-debug.apk
            echo "✓ Successfully prepared PlayDramaFlix-debug.apk"
          fi
          
          echo "================ Output Files ================"
          ls -lh output_apks/

      - name: 📤 Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PlayDramaFlix-APKs
          path: output_apks/*.apk
          retention-days: 30

      - name: 🏷️ Publish GitHub Release (on Version Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output_apks/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
